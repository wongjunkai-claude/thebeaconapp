<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Beacon App</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#FFF8EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Beacon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FFF8EC;
    --paper: #FFFFFF;
    --ink: #24344A;
    --ink-soft: #667588;
    --gold: #F5A623;
    --gold-deep: #D9860A;
    --gold-wash: #FFEACB;
    --leaf: #2F9E68;
    --leaf-wash: #DCF3E6;
    --sky: #3E8FCC;
    --sky-wash: #E1F0FC;
    --coral: #E2654B;
    --coral-wash: #FCE1D8;
    --danger: #E0533D;
    --danger-wash: #FCE3DE;
    --line: rgba(36,52,74,0.10);
    --shadow: rgba(36,52,74,0.10);
    --radius: 16px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--cream);
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
    min-height:100vh;
    position: relative;
  }
  body::before{
    content:'';
    position:fixed; inset:0;
    background-image: radial-gradient(rgba(36,52,74,0.05) 1px, transparent 1px);
    background-size: 15px 15px;
    pointer-events:none;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.03em; }

  /* ---------- Header / Beacon ---------- */
  header{
    position: relative;
    overflow: hidden;
    padding: 56px 24px 40px;
    text-align:center;
    background:
      radial-gradient(60% 55% at 50% 0%, rgba(245,166,35,0.16) 0%, transparent 70%),
      linear-gradient(180deg, #FFFCF6 0%, var(--cream) 100%);
    border-bottom: 1px solid var(--line);
  }
  .beam-wrap{
    position:absolute; inset:0;
    display:flex; align-items:flex-start; justify-content:center;
    pointer-events:none;
  }
  .beam{
    width: 380px; height: 380px;
    margin-top: -40px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(245,166,35,0.35) 0%, rgba(245,166,35,0.12) 45%, transparent 72%);
    animation: sunrise 4.5s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .beam{ animation: none; }
  }
  @keyframes sunrise{
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50%      { transform: scale(1.12); opacity: 1; }
  }
  .confetti{
    position:absolute; inset:0;
    z-index:1;
    pointer-events:none;
  }
  .confetti .dot{
    position:absolute;
    width:9px; height:9px;
    border-radius:50%;
  }
  .dot-gold{ top:38px; left:calc(50% - 130px); background: var(--gold); opacity:0.55; transform:rotate(10deg); }
  .dot-sky{ top:96px; left:calc(50% + 118px); width:7px; height:7px; background: var(--sky); opacity:0.5; }
  .dot-leaf{ top:150px; left:calc(50% - 150px); width:6px; height:6px; background: var(--leaf); opacity:0.5; }
  .dot-coral{ top:60px; left:calc(50% + 96px); width:8px; height:8px; background: var(--coral); opacity:0.45; }
  .dot-gold-2{ top:150px; left:calc(50% + 150px); width:5px; height:5px; background: var(--gold-deep); opacity:0.4; }

  .lighthouse-mark{
    position:relative;
    z-index:2;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-bottom: 18px;
  }
  .lighthouse-mark img{
    height: 84px;
    width: auto;
    filter: drop-shadow(0 8px 20px rgba(217,134,10,0.28));
  }

  h1{
    position:relative; z-index:2;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: clamp(2rem, 5vw, 3rem);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .tagline{
    position:relative; z-index:2;
    color: var(--ink-soft);
    font-size: 0.95rem;
    margin: 0;
  }

  .header-actions{
    position:relative; z-index:2;
    margin-top: 26px;
    display:flex; justify-content:center; gap:10px; flex-wrap:wrap;
  }

  /* ---------- Buttons ---------- */
  button{
    font-family:'Nunito', sans-serif;
    cursor:pointer;
    border:none;
    border-radius: 999px;
    font-size:0.85rem;
    font-weight:700;
    padding: 10px 18px;
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  button:active{ transform: scale(0.97); }
  @keyframes pop{
    0%   { transform: scale(1); }
    45%  { transform: scale(0.94); }
    100% { transform: scale(1); }
  }
  .pop{ animation: pop 220ms cubic-bezier(0.22, 1, 0.36, 1); }
  .btn-primary{ background: var(--gold); color: #2B1600; box-shadow: 0 4px 14px rgba(245,166,35,0.35); }
  .btn-primary:hover{ background:#ffb43e; }
  .btn-ghost{
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn-ghost:hover{ border-color: rgba(245,166,35,0.5); }
  .btn-danger{ background: transparent; color: var(--danger); border:1px solid rgba(224,83,61,0.4); }
  .btn-danger:hover{ background: var(--danger-wash); }
  .btn-locked{ background: var(--leaf-wash); color:#1E7048; border:1px solid rgba(47,158,104,0.35); }

  button:focus-visible, input:focus-visible, a:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  /* ---------- Main ---------- */
  main{
    max-width: 1180px;
    margin: 0 auto;
    padding: 36px 24px 80px;
  }
  @media (min-width: 900px){
    main{ padding: 44px 40px 90px; }
  }
  .toolbar{
    display:flex; gap:12px; flex-wrap:wrap;
    align-items:center; justify-content:space-between;
    margin-bottom: 26px;
  }
  .search-box{
    flex:1; min-width:220px;
    position:relative;
  }
  #searchInput{
    width:100%;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 12px 16px 12px 40px;
    border-radius: 999px;
    font-size: 0.92rem;
    box-shadow: 0 2px 8px var(--shadow);
  }
  #searchInput::placeholder{ color: var(--ink-soft); }
  .search-box svg{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; stroke: var(--ink-soft);
  }

  .lock-toggle{
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 2px 8px var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    padding: 0;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .lock-toggle svg{ width: 17px; height: 17px; }
  .lock-toggle:hover{ border-color: rgba(245,166,35,0.5); }
  .lock-toggle.on{ color: #1E7048; border-color: rgba(47,158,104,0.4); }

  .category-chips{
    display:flex; flex-wrap:wrap; gap:8px;
    margin: -8px 0 22px;
  }
  .cat-chip{
    font-size: 0.78rem;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .cat-chip:hover{ border-color: rgba(245,166,35,0.5); }
  .cat-chip.active{
    background: var(--ink);
    color: var(--cream);
    border-color: var(--ink);
  }
  .card-category{
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--sky);
    background: var(--sky-wash);
    padding: 2px 9px;
    border-radius: 999px;
    margin-bottom: 4px;
    width: fit-content;
  }

  /* ---------- Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
  }
  .card{
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 3px 10px var(--shadow);
    border-radius: var(--radius);
    padding: 20px;
    display:flex; flex-direction:row; align-items:center; gap: 14px;
    position:relative;
    cursor: pointer;
    transform: rotate(var(--rot, 0deg));
    transition: transform 0.22s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .card:hover{
    transform: rotate(0deg) translateY(-4px);
    border-color: rgba(245,166,35,0.45);
    box-shadow: 0 10px 24px rgba(36,52,74,0.16);
  }
  .card::before{
    content:'';
    position:absolute;
    top:-6px; left:50%;
    transform: translateX(-50%);
    width:10px; height:10px;
    border-radius:50%;
    background: var(--pin, var(--gold));
    box-shadow: 0 2px 4px rgba(36,52,74,0.3);
  }
  .card-icon-col{
    flex: 0 0 56px;
    display:flex; flex-direction:column; align-items:center;
    gap: 5px;
  }
  .card-icon{
    width:56px; height:56px;
    border-radius:12px;
    background: var(--icon-bg, var(--gold-wash));
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    flex-shrink:0;
  }
  .card-icon img{ width:100%; height:100%; object-fit:cover; }
  .card-icon svg{ width:22px; height:22px; stroke: var(--icon-fg, var(--gold-deep)); }
  .icon-fallback{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }
  .card-body{
    flex: 1;
    min-width: 0;
    display:flex; flex-direction:column; gap: 6px;
    padding-right: 42px; /* keep text clear of the stacked action icons */
  }
  .card h3{
    font-family:'Fredoka', sans-serif;
    font-size:1.08rem;
    font-weight:600;
    margin:0;
    line-height:1.3;
    color: var(--ink);
  }
  .card p{
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin:0;
    line-height:1.5;
  }
  .card-owner{
    display:block;
    font-size: 0.66rem;
    color: var(--ink-soft);
    opacity: 0.75;
    text-align: center;
    white-space: normal;
    line-height: 1.25;
    max-width: 56px;
    word-break: break-word;
  }
  .card-actions{
    display:flex; flex-direction:column; gap:6px;
    position:absolute; top:14px; right:14px;
    z-index: 2;
  }
  .fav-btn{
    background: var(--cream);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px;
    display:flex;
    color: var(--ink-soft);
  }
  .fav-btn svg{ width:15px; height:15px; }
  .fav-btn:hover{ color: var(--gold-deep); }
  .icon-btn{
    background: var(--cream);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px;
    display:flex;
  }
  .icon-btn svg{ width:14px; height:14px; stroke: var(--ink-soft); }
  .icon-btn:hover svg{ stroke: var(--gold-deep); }

  .empty-state{
    text-align:center;
    padding: 60px 20px;
    color: var(--ink-soft);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    background: var(--paper);
  }
  .empty-state h3{ font-family:'Fredoka', sans-serif; color: var(--ink); font-size:1.3rem; margin-bottom:8px;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0;
    background: rgba(36,52,74,0.45);
    display:flex; align-items:center; justify-content:center;
    padding: 20px;
    z-index: 50;
  }
  .modal{
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 20px 50px rgba(36,52,74,0.25);
    border-radius: var(--radius);
    padding: 28px;
    width: 100%;
    max-width: 420px;
    max-height: 88vh;
    overflow-y:auto;
  }
  .modal h2{
    font-family:'Fredoka', sans-serif;
    font-size:1.3rem;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .help-modal .help-section{
    margin-top: 16px;
  }
  .qr-image{
    display: block;
    margin: 12px auto 4px;
    border-radius: 8px;
    border: 1px solid var(--line);
  }
  .qr-modal .modal-actions a.btn-ghost{
    text-decoration: none;
    display: inline-flex;
    align-items: center;
  }
  .help-modal .help-section strong{
    display:block;
    font-size: 0.85rem;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .help-modal .help-section p{
    font-size: 0.82rem;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 0;
  }
  .help-version{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--ink-soft);
    opacity: 0.7;
    margin: 14px 0 0;
  }
  .modal .sub{
    color: var(--ink-soft);
    font-size:0.82rem;
    margin: 0 0 20px;
    line-height:1.5;
  }
  label{
    display:block;
    font-size:0.78rem;
    font-weight:700;
    color: var(--ink-soft);
    margin-bottom:6px;
    margin-top:16px;
  }
  label:first-of-type{ margin-top:0; }
  input[type=text], input[type=password], input[type=url], textarea{
    width:100%;
    background: var(--cream);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 12px;
    border-radius: 8px;
    font-size:0.88rem;
    font-family:'Nunito',sans-serif;
  }
  textarea{ resize:vertical; min-height:64px; }
  .icon-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
    gap: 8px;
    margin-top: 8px;
    max-height: 220px;
    overflow-y: auto;
    padding: 4px;
  }
  .icon-choice{
    width: 42px; height: 42px;
    border-radius: 10px;
    background: var(--cream);
    border: 1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    padding: 0;
  }
  .icon-choice svg{ width: 20px; height: 20px; stroke: var(--ink-soft); }
  .icon-choice:hover{ border-color: rgba(245,166,35,0.5); }
  .icon-choice.selected{
    background: var(--gold-wash);
    border-color: var(--gold-deep);
  }
  .icon-choice.selected svg{ stroke: var(--gold-deep); }
  .modal-actions{
    display:flex; gap:10px; justify-content:flex-end;
    margin-top: 24px;
  }
  .error-msg{
    color: var(--danger);
    font-size:0.78rem;
    margin-top:8px;
  }
  .hint{
    color: var(--ink-soft);
    font-size:0.72rem;
    margin-top:6px;
  }
  footer{
    text-align:center;
    color: var(--ink-soft);
    font-size: 0.75rem;
    padding: 20px;
  }
  .daily-quote{
    display: inline-block;
    font-family: 'Fredoka', sans-serif;
    font-size: 0.82rem;
    color: var(--ink-soft);
    font-style: italic;
  }
  .version-tag{
    display: inline-block;
    margin-top: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    opacity: 0.7;
  }
  .toolbar{ row-gap: 10px; }

  /* ---------- Toasts ---------- */
  #toastWrap{
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
    display:flex;
    flex-direction:column;
    gap: 10px;
    max-width: 320px;
  }
  .toast{
    background: var(--paper);
    border: 1px solid var(--line);
    border-left: 4px solid var(--gold);
    border-radius: 10px;
    padding: 12px 14px;
    display:flex;
    align-items:flex-start;
    gap: 10px;
    box-shadow: 0 8px 24px rgba(36,52,74,0.18);
    animation: toastIn 0.25s ease;
  }
  @keyframes toastIn{
    from{ opacity:0; transform: translateX(16px); }
    to{ opacity:1; transform: translateX(0); }
  }
  .toast svg{ width:18px; height:18px; stroke: var(--gold-deep); flex-shrink:0; margin-top:2px; }
  .toast-error{ border-color: rgba(224,83,61,0.35); border-left-color: var(--danger); }
  .toast-error svg{ stroke: var(--danger); }
  .toast-text{ font-size: 0.82rem; line-height:1.4; color: var(--ink); }
  .toast-text strong{ color: var(--ink); }
  .toast-close{
    background:none; border:none; color: var(--ink-soft); padding:0;
    font-size:1rem; line-height:1; margin-left:auto; cursor:pointer;
  }
  .toast-close:hover{ color: var(--ink); }
  .storage-warning{
    background: var(--danger-wash);
    border: 1px solid rgba(224,83,61,0.35);
    color: #A83E2C;
    font-size: 0.82rem;
    padding: 12px 16px;
    border-radius: 10px;
    max-width: 640px;
    margin: 0 auto 20px;
    text-align: left;
    line-height:1.5;
  }

  /* ---------- Install to Home Screen popup ---------- */
  .install-modal-icon{
    display: block;
    width: 64px; height: 64px;
    border-radius: 14px;
    margin: 0 auto 14px;
    box-shadow: 0 4px 14px var(--shadow);
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

      var bin = base64DecodeInputStream(unicodeData);

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {

            } else {

              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };

<script>
/* ---------- Add to Home Screen ---------- */
let deferredInstallPrompt = null;

function isStandaloneDisplay(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallPopup();
});
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  closeModal();
});

function showInstallPopup(){
  if(isStandaloneDisplay()) return;
  const root = document.getElementById('modalRoot');
  const onIOS = isIOS();
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this) dismissInstallPopup()">
      <div class="modal install-modal">
        <img src="icons/icon-192.png" alt="" class="install-modal-icon">
        <h2 style="text-align:center;">Add Beacon to your Home Screen</h2>
        <p class="sub" style="text-align:center;">
          ${onIOS
            ? 'Tap the Share icon in Safari\'s toolbar below, then choose "Add to Home Screen."'
            : 'Get one-tap access from your phone or desktop, just like a regular app.'}
        </p>
        <div class="modal-actions" style="justify-content:center;">
          <button class="btn-ghost" onclick="dismissInstallPopup()">Not now</button>
          ${onIOS ? '' : '<button class="btn-primary" onclick="handleInstallClick()">Add to Home Screen</button>'}
        </div>
      </div>
    </div>`;
  isModalOpen = true;
}
function dismissInstallPopup(){
  closeModal(); // reappears on next reload/visit unless actually installed
}
async function handleInstallClick(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const { outcome } = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    if(outcome === 'accepted') closeModal();
    return;
  }
}

/* ---------- "What's new since your last visit" ---------- */
function loadSeenIds(){
  try{
    const raw = localStorage.getItem('beacon:seenIds');
    return raw ? new Set(JSON.parse(raw)) : null; // null = first-ever visit on this device
  }catch(e){
    return null;
  }
}
function persistSeenIds(ids){
  try{
    localStorage.setItem('beacon:seenIds', JSON.stringify([...ids]));
  }catch(e){}
}
function showNewFormsModal(newOnes){
  const root = document.getElementById('modalRoot');
  const items = newOnes.map(f => `
    <div class="help-section">
      <strong>${escapeHtml(f.title)}</strong>
      <p>${escapeHtml(f.description||'')}</p>
    </div>`).join('');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal help-modal">
        <h2>${newOnes.length === 1 ? 'New form added' : `${newOnes.length} new forms added`}</h2>
        <p class="sub">Added while you were away:</p>
        ${items}
        <div class="modal-actions"><button class="btn-primary" onclick="closeModal()">Got it</button></div>
      </div>
    </div>`;
  isModalOpen = true;
}

function showQrModal(id){
  const f = forms.find(x => x.id === id);
  if(!f) return;
  const root = document.getElementById('modalRoot');
  let dataUrl = '';
  try{
    const qr = qrcode(0, 'M');
    qr.addData(f.link);
    qr.make();
    dataUrl = qr.createDataURL(8, 8);
  }catch(e){
    console.error('QR generation failed', e);
  }
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal qr-modal">
        <h2>${escapeHtml(f.title)}</h2>
        <p class="sub">Scan to open this form, or download to print on a noticeboard.</p>
        ${dataUrl
          ? `<img src="${dataUrl}" alt="QR code for ${escapeHtml(f.title)}" class="qr-image">`
          : `<p class="error-msg">Could not generate the QR code.</p>`}
        <div class="modal-actions">
          ${dataUrl ? `<a class="btn-ghost" href="${dataUrl}" download="${escapeHtml(f.title).replace(/[^a-z0-9]+/gi,'-')}-qr.png">Download</a>` : ''}
          <button class="btn-primary" onclick="closeModal()">Close</button>
        </div>
      </div>
    </div>`;
  isModalOpen = true;
}

function openHelpModal(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal help-modal">
        <h2>How Beacon works</h2>
        <div class="help-section">
          <strong>Finding a form</strong>
          <p>Use the search bar to filter by name or description. Tap the star on any form to favourite it — favourites are personal to your device and float to the top of your own view.</p>
        </div>
        <div class="help-section">
          <strong>Opening a form</strong>
          <p>Tap anywhere on a form's card to open it in a new tab.</p>
        </div>
        <div class="help-section">
          <strong>The lock icon</strong>
          <p>BCPS EXCO members can tap the lock and enter this year's shared passcode to add, edit, or delete forms. Tap it again to lock it back — no passcode needed to lock.</p>
        </div>
        <div class="help-section">
          <strong>Add to Home Screen</strong>
          <p>On iPhone: tap Share in Safari, then "Add to Home Screen." On Android/desktop Chrome: tap "Add" on the banner, or use your browser's install option.</p>
        </div>
        <div class="modal-actions"><button class="btn-primary" onclick="closeModal()">Got it</button></div>
        <p class="help-version">Beacon v${APP_VERSION}</p>
      </div>
    </div>`;
  isModalOpen = true;
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

let forms = [];
let favorites = new Set();
const APP_VERSION = '1.6.0';

/* ---------- Deterministic weighted daily quote engine ----------
   Reads selection_config.periods + quotes from quotes.json (fetched at
   runtime). Builds one full annual schedule deterministically, then looks
   up today's local-date entry. Same date+year always yields the same
   quote; a new year reshuffles everything. The `author` field is metadata
   only and is never displayed, per spec. */

// FNV-1a string hash -> unsigned 32-bit int. Used to turn any string
// (year/period/theme combo) into a stable numeric seed.
function hashStringToInt(str){
  let h = 0x811c9dc5;
  for(let i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

// mulberry32 seeded PRNG -> returns a function yielding floats in [0,1).
// Same seed always produces the same sequence.
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Derive a stable sub-seed from any combination of parts, e.g.
// deriveSeed(2026, 'period-2', 'Growth') — used to seed each theme's
// per-period shuffle independently and reproducibly.
function deriveSeed(...parts){
  return hashStringToInt(parts.join('|'));
}

// Seeded Fisher–Yates shuffle. Returns a NEW array; same seed + same input
// array always produces the same order.
function seededShuffle(array, seed){
  const arr = array.slice();
  const rng = mulberry32(seed);
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function isLeapYear(year){
  return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
}

// 'MM-DD' -> {month, day} (1-indexed month)
function parseMonthDay(str){
  const [m, d] = str.split('-').map(Number);
  return { month: m, day: d };
}

function formatDateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// Ordered list of 'YYYY-MM-DD' strings from startMD to endMD (inclusive)
// within `year`. Relies on JS Date's natural day-by-day rollover, so
// Feb 29 only ever appears in the sequence when `year` is actually a leap
// year — no special-casing needed for non-leap years.
function dateRangeStrings(year, startMD, endMD){
  const start = parseMonthDay(startMD);
  const end = parseMonthDay(endMD);
  const startDate = new Date(year, start.month - 1, start.day);
  const endDate = new Date(year, end.month - 1, end.day);
  const out = [];
  const cur = new Date(startDate);
  while(cur <= endDate){
    out.push(formatDateStr(cur));
    cur.setDate(cur.getDate() + 1);
  }
  return out;
}

// Weighted pick: given {theme: weight, ...} and a [0,1) random value,
// return one theme name.
function weightedThemePick(weightsObj, randValue){
  const entries = Object.entries(weightsObj);
  const total = entries.reduce((s, [, w]) => s + w, 0);
  let target = randValue * total;
  for(const [theme, weight] of entries){
    if(target < weight) return theme;
    target -= weight;
  }
  return entries[entries.length - 1][0]; // floating-point safety net
}

// On 29 Feb, draw from this set instead of the enclosing period's themes.
const LEAP_DAY_THEMES = { Renewal: 0.25, Reflection: 0.25, Growth: 0.25, Purpose: 0.25 };
const LEAP_DAY_PERIOD_ID = 'leap-day';

/* Build the full annual schedule for `year` from the parsed quotes.json
   (`quotesData`). Returns { 'YYYY-MM-DD': quoteObject, ... } covering every
   day of the year (365, or 366 in a leap year). Quotes never repeat within
   the year; if a theme's pool is exhausted mid-period, the draw is
   redistributed among the period's remaining themes. */
function buildAnnualSchedule(year, quotesData){
  const quotesByTheme = {};
  quotesData.quotes.forEach(q => {
    (quotesByTheme[q.theme] = quotesByTheme[q.theme] || []).push(q);
  });

  // One seeded shuffle + read pointer per (periodId, theme) combination.
  const queues = {};
  function getQueue(periodId, theme){
    const key = periodId + '::' + theme;
    if(!queues[key]){
      const pool = quotesByTheme[theme] || [];
      queues[key] = { list: seededShuffle(pool, deriveSeed(year, periodId, theme)), idx: 0 };
    }
    return queues[key];
  }

  const usedIds = new Set();

  // Pull the next not-yet-used quote for a theme within a period.
  // Returns null if that theme's 35-quote pool is exhausted for this period.
  function drawFromTheme(periodId, theme){
    const q = getQueue(periodId, theme);
    while(q.idx < q.list.length){
      const candidate = q.list[q.idx++];
      if(!usedIds.has(candidate.id)){
        usedIds.add(candidate.id);
        return candidate;
      }
    }
    return null;
  }

  // Weighted draw for one day, redistributing among the remaining themes
  // in the same period if the first-picked theme turns out exhausted.
  function drawForDay(periodId, themeWeights, rng){
    let remaining = { ...themeWeights };
    while(Object.keys(remaining).length > 0){
      const theme = weightedThemePick(remaining, rng());
      const quote = drawFromTheme(periodId, theme);
      if(quote) return quote;
      delete remaining[theme];
    }
    return null; // only possible if the whole 630-quote pool is exhausted
  }

  const schedule = {};
  // Single RNG stream, advanced once per calendar day in chronological
  // order, decides which theme each day draws from.
  const dayRng = mulberry32(deriveSeed(year, 'day-theme-choice'));

  quotesData.selection_config.periods.forEach(period => {
    dateRangeStrings(year, period.start, period.end).forEach(dateStr => {
      const isLeapDay = dateStr.slice(5) === '02-29';
      const themeWeights = isLeapDay ? LEAP_DAY_THEMES : period.themes;
      const periodId = isLeapDay ? LEAP_DAY_PERIOD_ID : period.id;
      const quote = drawForDay(periodId, themeWeights, dayRng);
      if(quote) schedule[dateStr] = quote;
    });
  });

  return schedule;
}

// Look up today's quote using the LOCAL date (not UTC).
function getTodaysQuoteFromSchedule(schedule, now){
  return schedule[formatDateStr(now || new Date())] || null;
}

let dailyQuoteScheduleCache = null; // { year, schedule } — avoids rebuilding on every render within the same load
async function initDailyQuote(){
  try{
    const res = await fetch('quotes.json');
    if(!res.ok) throw new Error('quotes.json fetch failed: ' + res.status);
    const data = await res.json();
    const year = new Date().getFullYear();
    const schedule = buildAnnualSchedule(year, data);
    dailyQuoteScheduleCache = { year, schedule };
    const today = getTodaysQuoteFromSchedule(schedule);
    const el = document.getElementById('dailyQuote');
    if(today && el){
      el.textContent = `“${today.quote}”`; // author is metadata only — never displayed
    }
  }catch(e){
    console.error('Could not load daily quote', e);
  }
}

function uid(){ return 'f_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

async function loadForms(){
  if(!db){ forms = []; return; }
  try{
    const doc = await db.collection('beacon').doc('forms').get();
    forms = doc.exists ? (doc.data().list || []) : [];
  }catch(e){
    forms = [];
  }
}
async function saveForms(){
  if(!db){
    showToast('Not connected to the shared database yet — see the setup notice above.', true);
    return false;
  }
  try{
    await db.collection('beacon').doc('forms').set({ list: forms });
    knownIds = new Set(forms.map(f => f.id));
    return true;
  }catch(e){
    showToast('Could not save — please try again.', true);
    return false;
  }
}

   never shared with other teachers, no backend needed. */
async function loadFavorites(){
  try{
    const raw = localStorage.getItem('beacon:favorites');
    favorites = new Set(raw ? JSON.parse(raw) : []);
  }catch(e){
    favorites = new Set();
  }
}
async function toggleFavorite(id){
  if(favorites.has(id)) favorites.delete(id); else favorites.add(id);
  renderGrid();
  try{
    localStorage.setItem('beacon:favorites', JSON.stringify([...favorites]));
  }catch(e){
    showToast('Could not save your favourite — please try again.', true);
  }
}

  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

  if(!all.includes(activeCategory)) activeCategory = 'All';
  wrap.innerHTML = all.map(c => `
    <button class="cat-chip${c === activeCategory ? ' active' : ''}" onclick="setActiveCategory('${escapeHtml(c).replace(/'/g, "\\'")}')">${escapeHtml(c)}</button>
  `).join('');
}
function setActiveCategory(c){
  activeCategory = c;
  renderGrid();
}

function renderGrid(){
  renderCategoryChips();
  const wrap = document.getElementById('gridWrap');
  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  if(loading){
    wrap.innerHTML = `<div class="empty-state">Loading forms…</div>`;
    return;
  }
  let filtered = forms.filter(f =>
    f.title.toLowerCase().includes(q) || (f.description||'').toLowerCase().includes(q)
  );
  if(activeCategory && activeCategory !== 'All'){
    filtered = filtered.filter(f => (f.category || '').trim() === activeCategory);
  }
  // Favourited forms float to the top, personal to this user only
  filtered = filtered
    .map((f, i) => ({ f, i, fav: favorites.has(f.id) ? 0 : 1 }))
    .sort((a, b) => a.fav - b.fav || a.i - b.i)
    .map(x => x.f);
  if(forms.length === 0){
    wrap.innerHTML = `
      <div class="empty-state">
        <h3>No forms yet</h3>
        <p>${unlocked ? 'Add the first one with the button above.' : 'Ask a committee member to add the first form.'}</p>
      </div>`;
    return;
  }
  if(filtered.length === 0){
    wrap.innerHTML = `<div class="empty-state"><h3>No matches</h3><p>Try a different search term.</p></div>`;
    return;
  }
  wrap.innerHTML = `<div class="grid">${filtered.map(cardHtml).join('')}</div>`;
}

const cardPalette = [
  { bg: '#FFEACB', fg: '#D9860A', pin: '#F5A623' }, // gold
  { bg: '#E1F0FC', fg: '#1D5D8A', pin: '#3E8FCC' }, // sky
  { bg: '#DCF3E6', fg: '#1E7048', pin: '#2F9E68' }, // leaf
  { bg: '#FCE1D8', fg: '#B23A22', pin: '#E2654B' }  // coral
];
const cardTilts = [-1.6, -0.8, 0.5, 1.4, -1.1, 1.8, -0.4, 0.9];
function hashStr(s){
  let h = 0;
  for(let i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

function cardHtml(f){
  const palette = cardPalette[hashStr(f.id) % cardPalette.length];
  const tilt = cardTilts[hashStr(f.id + 'tilt') % cardTilts.length];
  const contextIcon = pickIconForForm(f);
  let iconInner;
  if(f.icon && ICON_LIBRARY[f.icon]){
    iconInner = ICON_LIBRARY[f.icon].svg;
  } else if(f.icon){
    // Backward compatibility with forms that still have an old uploaded/URL image
    iconInner = `<img src="${escapeHtml(f.icon)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"><span class="icon-fallback" style="display:none">${contextIcon}</span>`;
  } else {
    iconInner = contextIcon;
  }
  const adminButtons = unlocked ? `
      <button class="icon-btn" title="Edit" onclick="event.stopPropagation(); openFormModal('${f.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
      </button>
      <button class="icon-btn" title="Delete" onclick="event.stopPropagation(); deleteForm('${f.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path></svg>
      </button>` : '';
  const isFav = favorites.has(f.id);
  const favBtn = `
    <button class="fav-btn" title="${isFav ? 'Remove from favourites' : 'Add to favourites'}" onclick="event.stopPropagation(); toggleFavorite('${f.id}')">
      <svg viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
    </button>`;
  const qrBtn = `
    <button class="fav-btn" title="Show QR code" onclick="event.stopPropagation(); showQrModal('${f.id}')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><line x1="14" y1="14" x2="14" y2="21"></line><line x1="21" y1="14" x2="21" y2="21"></line><line x1="14" y1="17.5" x2="21" y2="17.5"></line></svg>
    </button>`;
  return `
    <div class="card" style="--rot:${tilt}deg; --pin:${palette.pin};" onclick="window.open('${escapeHtml(f.link)}', '_blank', 'noopener,noreferrer')">
      <div class="card-actions">
        ${favBtn}
        ${qrBtn}
        ${adminButtons}
      </div>
      <div class="card-icon-col">
        <div class="card-icon" style="--icon-bg:${palette.bg}; --icon-fg:${palette.fg};">${iconInner}</div>
        ${f.owner ? `<div class="card-owner" title="By ${escapeHtml(f.owner)}">By ${escapeHtml(f.owner)}</div>` : ''}
      </div>
      <div class="card-body">
        ${f.category ? `<div class="card-category">${escapeHtml(f.category)}</div>` : ''}
        <h3>${escapeHtml(f.title)}</h3>
        <p>${escapeHtml(f.description||'')}</p>
      </div>
    </div>`;
}

function deleteForm(id){
  const f = forms.find(x => x.id === id);
  if(!f) return;
  isModalOpen = true;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h2>Remove this form?</h2>
        <p class="sub">"${escapeHtml(f.title)}" will be removed from Beacon for everyone.</p>
        <div class="modal-actions">
          <button class="btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn-danger" onclick="confirmDeleteForm('${id}')">Remove form</button>
        </div>
      </div>
    </div>`;
}

async function confirmDeleteForm(id){
  forms = forms.filter(f => f.id !== id);
  await saveForms();
  closeModal();
  renderGrid();
}

/* ---------- Modals ---------- */
let isModalOpen = false;
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; isModalOpen = false; }

function getCurrentPasscode(){
  const yy = new Date().getFullYear().toString().slice(-2);
  return 'bcpsexco' + yy;
}

function openUnlockModal(){
  isModalOpen = true;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h2>BCPS EXCO access only</h2>
        <p class="sub">Enter this year's shared passcode to unlock adding and editing forms.</p>
        <label for="pcEnter">Passcode</label>
        <input type="password" id="pcEnter" placeholder="Enter passcode" onkeydown="if(event.key==='Enter') submitUnlock()">
        <div class="error-msg" id="unlockError"></div>
        <div class="modal-actions">
          <button class="btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn-primary" onclick="submitUnlock()">Unlock</button>
        </div>
      </div>
    </div>`;
}

function submitUnlock(){
  const val = document.getElementById('pcEnter').value.trim();
  if(val === getCurrentPasscode()){
    unlocked = true;
    closeModal();
    renderHeaderActions();
    renderGrid();
  } else {
    document.getElementById('unlockError').textContent = 'Incorrect passcode.';
  }
}

let pendingIcon = '';

function openFormModal(editId){
  isModalOpen = true;
  const editing = editId ? forms.find(f => f.id === editId) : null;
  // Only carry over the previous value if it's a known icon-library key;
  // legacy image URLs/uploads from before are left as-is on the form itself
  // but won't pre-select anything here since we no longer offer upload.
  pendingIcon = editing && ICON_LIBRARY[editing.icon] ? editing.icon : '';
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h2>${editing ? 'Edit form' : 'Add a new form'}</h2>
        <p class="sub">Visible to every teacher. Only committee members can make changes.</p>

        <label for="fTitle">Form title</label>
        <input type="text" id="fTitle" placeholder="e.g. Fault Reporting" value="${editing ? escapeHtml(editing.title) : ''}">

        <label for="fDesc">Short description</label>
        <textarea id="fDesc" placeholder="What is this form for?">${editing ? escapeHtml(editing.description||'') : ''}</textarea>

        <label for="fLink">Form link</label>
        <input type="url" id="fLink" placeholder="https://…" value="${editing ? escapeHtml(editing.link) : ''}">

        <label for="fOwner">Form owner</label>
        <input type="text" id="fOwner" placeholder="e.g. OM &amp; ICT Manager" value="${editing ? escapeHtml(editing.owner||'') : ''}">

        <label for="fCategory">Category</label>
        <input type="text" id="fCategory" list="categoryOptions" placeholder="e.g. Student Matters" value="${editing ? escapeHtml(editing.category||'') : ''}">
        <datalist id="categoryOptions">
          ${[...new Set(forms.map(f => (f.category||'').trim()).filter(Boolean))].sort().map(c => `<option value="${escapeHtml(c)}">`).join('')}
        </datalist>

        <label>Icon</label>
        <div class="icon-grid" id="iconGrid">${iconGridHtml()}</div>
        <p class="hint">Tap one to choose it, tap again to let Beacon auto-pick an icon based on the title instead.</p>

        <div class="error-msg" id="formError"></div>
        <div class="modal-actions">
          <button class="btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn-primary" onclick="submitForm('${editing ? editing.id : ''}')">${editing ? 'Save changes' : 'Add form'}</button>
        </div>
      </div>
    </div>`;
}

function iconGridHtml(){
  return Object.entries(ICON_LIBRARY).map(([key, icon]) => `
    <button type="button" class="icon-choice${pendingIcon === key ? ' selected' : ''}" title="${escapeHtml(icon.label)}" onclick="selectIcon('${key}')">
      ${icon.svg}
    </button>`).join('');
}

function selectIcon(key){
  pendingIcon = pendingIcon === key ? '' : key; // tap again to deselect back to auto/contextual
  document.getElementById('iconGrid').innerHTML = iconGridHtml();
}

async function submitForm(editId){
  const title = document.getElementById('fTitle').value.trim();
  const desc = document.getElementById('fDesc').value.trim();
  const link = document.getElementById('fLink').value.trim();
  const owner = document.getElementById('fOwner').value.trim();
  const category = document.getElementById('fCategory').value.trim();
  const err = document.getElementById('formError');
  if(!title){ err.textContent = 'Give the form a title.'; return; }
  if(!link){ err.textContent = 'Add a link to the form.'; return; }

  if(editId){
    const f = forms.find(x => x.id === editId);
    f.title = title; f.description = desc; f.link = link; f.owner = owner; f.category = category; f.icon = pendingIcon;
  } else {
    forms.push({ id: uid(), title, description: desc, link, owner, category, icon: pendingIcon, addedAt: Date.now() });
  }
  await saveForms();
  closeModal();
  renderGrid();
}

/* ---------- Toasts ---------- */
function showToast(message, isError){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' toast-error' : '');
  const label = isError ? '' : '<strong>New form added:</strong><br>';
  const icon = isError
    ? `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;
  el.innerHTML = `
    ${icon}
    <div class="toast-text">${label}${escapeHtml(message)}</div>
    <button class="toast-close" onclick="this.parentElement.remove()">×</button>
  `;
  wrap.appendChild(el);
  setTimeout(() => { el.remove(); }, 8000);
}

/* ---------- Real-time sync ---------- */
function startRealtimeSync(){
  if(!db) return;
  db.collection('beacon').doc('forms').onSnapshot((docSnap) => {
    if(isModalOpen) return; // don't disturb someone mid-edit
    if(!docSnap.exists) return;
    const latest = docSnap.data().list || [];
    const added = latest.filter(f => !knownIds.has(f.id));
    forms = latest;
    knownIds = new Set(latest.map(f => f.id));
    persistSeenIds(knownIds);
    if(!loading){
      added.forEach(f => showToast(f.title));
      renderGrid();
    }
  }, (err) => {
    console.error('Realtime sync error', err);
  });
}

/* ---------- Init ---------- */
/* ---------- Pop feedback on any button or card ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('button, .card');
  if(!el) return;
  el.classList.remove('pop');
  void el.offsetWidth; // restart the animation even on rapid repeat clicks
  el.classList.add('pop');
});

(async function init(){
  document.getElementById('versionTag').textContent = `Beacon v${APP_VERSION}`;
  initDailyQuote(); // async — fetches quotes.json, builds the annual schedule, renders today's quote
  if(isIOS() && !isStandaloneDisplay()){
    showInstallPopup();
  }
  if(!db){
    document.getElementById('storageWarning').innerHTML = `
      <div class="storage-warning">
        <strong>Not connected to the shared database yet.</strong><br>
        Add your Firebase project config near the top of the script (search for "firebaseConfig") so forms and updates sync for everyone. Until then, you'll only see the built-in default forms.
      </div>`;
  }
  await loadForms();
  await loadFavorites();
  const seedForms = [
    {
      title: 'Fault Reporting',
      description: 'Report IT or furniture faults',
      oldDescription: 'Report any IT or furniture faults',
      link: 'https://docs.google.com/forms/d/e/1FAIpQLSdiPWiEn5kBMcVy58i_4RvVZ2wjzU6GJXhc5K3HGdgRkUMBvQ/viewform',
      owner: 'OM & ICT Manager',
      category: 'Facilities & IT'
    },
    {
      title: 'Student Well-Being Referral',
      description: 'Refer students needing SENO or School Counsellor support',
      oldDescription: 'Refer students who may require support from the Special Educational Needs Officer (SENO) or School Counsellor (SC)',
      link: 'https://form.gov.sg/69f2c375fdb2e80339872dec',
      owner: 'SH/SWB',
      category: 'Student Matters'
    },
    {
      title: 'Student Management Incident & Offence Reporting',
      description: 'Report student incidents or injuries to SDT',
      oldDescription: 'Report any incidents and/or injuries to the Student Development Team (SDT)',
      link: 'https://form.gov.sg/69645165717727d03629876b',
      owner: 'SH/SM',
      category: 'Student Matters'
    }
  ];
  let seededAny = false;
  seedForms.forEach(seed => {
    const existing = forms.find(f => f.link === seed.link);
    if(!existing){
      forms.push({ id: uid(), title: seed.title, description: seed.description, link: seed.link, owner: seed.owner, category: seed.category, icon: '', addedAt: Date.now() });
      seededAny = true;
    } else {
      if(!existing.owner && seed.owner){
        existing.owner = seed.owner;
        seededAny = true;
      }
      if(!existing.category && seed.category){
        existing.category = seed.category;
        seededAny = true;
      }
      // Only migrate if it still has the original longer wording — never overwrite a committee member's own edit
      if(existing.description === seed.oldDescription){
        existing.description = seed.description;
        seededAny = true;
      }
    }
  });
  if(seededAny && db){
    await saveForms();
  }
  const seenIds = loadSeenIds();
  const isFirstVisit = seenIds === null;
  const newSinceLastVisit = isFirstVisit ? [] : forms.filter(f => !seenIds.has(f.id));
  knownIds = new Set(forms.map(f => f.id));
  persistSeenIds(knownIds);
  loading = false;
  renderHeaderActions();
  renderGrid();
  startRealtimeSync();
  if(newSinceLastVisit.length > 0){
    showNewFormsModal(newSinceLastVisit);
  }
})();
</script>
